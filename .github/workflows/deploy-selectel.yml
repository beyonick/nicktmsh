name: Deploy to Selectel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-selectel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SELECTEL_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SELECTEL_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.SELECTEL_S3_REGION || 'ru-7' }}
      S3_ENDPOINT: ${{ vars.SELECTEL_S3_ENDPOINT || 'https://s3.ru-7.storage.selcloud.ru' }}
      BUCKET: ${{ vars.SELECTEL_BUCKET }}
      # Новые aws cli шлют CRC-контрольные суммы, которые S3-совместимые хранилища не всегда принимают.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Встроенный в aws cli список корневых сертификатов не знает GlobalSign R6, которым подписан Selectel.
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/deploy-selectel.sh --upload
