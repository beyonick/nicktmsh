name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOSTING_PROTOCOL: ${{ vars.HOSTING_PROTOCOL || 'sftp' }}
      HOSTING_HOST: ${{ vars.HOSTING_HOST }}
      HOSTING_USER: ${{ vars.HOSTING_USER }}
      HOSTING_DIR: ${{ vars.HOSTING_DIR || 'www/nicktmsh.com' }}
      HOSTING_PASSWORD: ${{ secrets.HOSTING_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MEDIA_S3_ACCESS_KEY: ${{ secrets.SELECTEL_S3_ACCESS_KEY }}
      MEDIA_S3_SECRET_KEY: ${{ secrets.SELECTEL_S3_SECRET_KEY }}
      MEDIA_BUCKET: ${{ vars.MEDIA_BUCKET || 'websites-media' }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq lftp
      - run: bash .github/deploy-hosting.sh --upload
